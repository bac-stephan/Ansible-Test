---
- name: Komplettes System-Update auf allen Fedora-Nodes
  hosts: all_nodes
  become: true

  tasks:
    - name: Fedora DNF-Pakete aktualisieren
      ansible.builtin.dnf:
        name: "*"
        state: latest # noqa: package-latest
        update_cache: true

    - name: Systemweite Flatpak-Pakete aktualisieren
      ansible.builtin.command: flatpak update -y --system
      changed_when: false

    - name: User Flatpak-Pakete aktualisieren
      ansible.builtin.command: flatpak update -y --user
      become: false
      changed_when: false

    - name: Notebooks neu starten
      ansible.builtin.reboot:
        msg: "Neustart durch Ansible-Update"
        reboot_timeout: 600
      when: inventory_hostname != 'optiplex'
